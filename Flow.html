.status-opt-row{display:flex;align-items:center;border-radius:7px;}
.status-opt-row:hover{background:var(--bg);}
.status-opt-row .status-opt{flex:1;min-width:0;}
.status-opt-row .status-opt:hover{background:none;}
.status-opt-actions{display:flex;align-items:center;gap:2px;padding-right:5px;opacity:0;transition:opacity .12s;}
.status-opt-row:hover .status-opt-actions{opacity:1;}
.status-opt-act{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--muted);}
.status-opt-act:hover{background:var(--panel);color:var(--accent);}
.status-opt-act.del:hover{color:#d2553f;}
.status-opt.addnew{color:var(--accent);font-weight:600;}
.status-opt.addnew:hover{background:var(--accent-soft);}

/* ---- Section (group) options menu ---- */
.group-menu-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--muted-2);opacity:0;margin-left:2px;transition:opacity .12s,background .12s;}
.group-head:hover .group-menu-btn{opacity:1;}
.group-menu-btn:hover{background:var(--panel);color:var(--text);}
.group-del-confirm{padding:9px;display:flex;flex-direction:column;gap:9px;}
.group-del-text{font-size:12.5px;color:var(--text-2);line-height:1.4;}
.group-del-actions{display:flex;gap:7px;justify-content:flex-end;}
.group-del-cancel{font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 11px;border-radius:7px;}
.group-del-cancel:hover{background:var(--bg);}
.group-del-yes{font-size:12.5px;font-weight:600;color:#fff;background:#d2553f;padding:6px 13px;border-radius:7px;}
.group-del-yes:hover{filter:brightness(.95);}

/* ---- Space editor: delete ---- */
.se-delete{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;font-size:12.5px;font-weight:500;color:var(--muted);padding:8px;border-radius:8px;border:1px solid var(--border);}
.se-delete:hover{color:#d2553f;border-color:#e7b9b0;background:#fdf1ee;}
.se-del-confirm{margin-top:10px;padding-top:11px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px;}
.se-del-confirm>span{font-size:12.5px;color:var(--text-2);line-height:1.4;}
.se-del-actions{display:flex;gap:7px;}
.se-del-cancel{flex:1;font-size:12.5px;font-weight:500;color:var(--muted);padding:8px;border-radius:7px;border:1px solid var(--border);}
.se-del-cancel:hover{background:var(--bg);}
.se-del-yes{flex:1;font-size:12.5px;font-weight:600;color:#fff;background:#d2553f;padding:8px;border-radius:7px;}
.se-del-yes:hover{filter:brightness(.95);}

/* ---- Task panel: add status / owner ---- */
.tp-pill-add{display:inline-flex;align-items:center;gap:4px;color:var(--muted)!important;background:none!important;box-shadow:inset 0 0 0 1.5px var(--border-strong)!important;}
.tp-pill-add:hover{color:var(--accent)!important;box-shadow:inset 0 0 0 1.5px var(--accent)!important;}
.tp-status-wrap{position:relative;display:inline-flex;}
.tp-status-actions{position:absolute;top:-8px;right:-6px;display:flex;align-items:center;gap:1px;opacity:0;transition:opacity .12s;background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:1px;}
.tp-status-wrap:hover .tp-status-actions{opacity:1;}
.tp-status-act{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;color:var(--muted);}
.tp-status-act:hover{background:var(--bg);color:var(--accent);}
.tp-status-act.del:hover{color:#d2553f;}
.tp-owner-add{color:var(--muted);border-style:dashed;}
.tp-owner-add:hover{color:var(--accent);border-color:var(--accent);}
.tp-field-ctl .pal-composer{padding:10px 0 0;}
.tp-field-ctl .pal-comp-swatches{grid-template-columns:repeat(8,22px);}

/* ---- Task panel: meta fields + date sub-options + files ---- */
.tp-meta{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:2px 8px;background:var(--bg);transition:border-color .12s,background .12s;}
.tp-meta:focus-within{border-color:var(--accent);background:var(--panel);}
.tp-meta-icon{display:flex;color:var(--muted-2);flex:0 0 auto;}
.tp-meta:focus-within .tp-meta-icon{color:var(--accent);}
.tp-meta-input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:13.5px;color:var(--text);padding:8px 0;}
.tp-meta-input::placeholder{color:var(--muted-2);}
.tp-meta-open{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 9px;border-radius:6px;background:var(--accent-soft);}
.tp-meta-open:hover{filter:brightness(.97);}
.tp-subopts{display:flex;flex-direction:column;gap:6px;margin-top:9px;}
.tp-subopt{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:var(--bg);cursor:pointer;transition:border-color .12s;}
.tp-subopt:hover{border-color:var(--border-strong);}
.tp-subopt.on{border-color:var(--accent);background:var(--accent-soft);}
.tp-subopt-ic{display:flex;color:var(--muted);flex:0 0 auto;}
.tp-subopt.on .tp-subopt-ic{color:var(--accent);}
.tp-subopt-lbl{font-size:13px;font-weight:500;color:var(--text-2);flex:1;}
.tp-subopt.on .tp-subopt-lbl{color:var(--accent);font-weight:600;}
.tp-subopt-sel{border:none;outline:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;text-align:right;direction:rtl;max-width:150px;}
.tp-subopt.on .tp-subopt-sel{color:var(--accent);}
.tp-subopt-col{flex-direction:column;align-items:stretch;gap:9px;}
.tp-subopt-row{display:flex;align-items:center;gap:9px;}
.tp-subopt-row .tp-subopt-lbl{flex:1;}
.tp-repeat-extra{display:flex;align-items:center;gap:8px;padding-left:24px;}
.tp-repeat-extra input{border:1px solid var(--border-strong);border-radius:7px;padding:6px 9px;font-size:13px;font-family:inherit;color:var(--text);background:var(--panel);outline:none;}
.tp-repeat-extra input:focus{border-color:var(--accent);}
.tp-repeat-extra input[type=number]{width:74px;}
.tp-repeat-extra span{font-size:12.5px;color:var(--muted);font-weight:500;}
.tp-attach-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.tp-attach{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--bg);}
.tp-attach-ic{display:flex;color:var(--muted);flex:0 0 auto;}
.tp-attach-name{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;}
a.tp-attach-name:hover{color:var(--accent);text-decoration:underline;}
.tp-attach-size{font-size:11.5px;color:var(--muted-2);font-weight:500;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.tp-attach-del{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--muted-2);flex:0 0 auto;}
.tp-attach-del:hover{color:#d2553f;background:var(--panel);}
.tp-attach-actions{display:flex;gap:8px;}
.tp-attach-add{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);border:1px dashed var(--border-strong);border-radius:8px;padding:8px 12px;background:none;cursor:pointer;}
.tp-attach-add:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
.tp-attach-linkadd{display:flex;gap:7px;}
.tp-attach-linkadd input{flex:1;min-width:0;border:1.5px solid var(--accent);border-radius:8px;padding:8px 11px;font-size:13.5px;font-family:inherit;outline:none;color:var(--text);background:var(--panel);}
.tp-attach-linkbtn{font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:0 15px;border-radius:8px;flex:0 0 auto;}
.tp-attach-linkbtn:disabled{opacity:.45;cursor:not-allowed;}

/* ---- Meeting recorder ---- */
.mtg{width:760px;max-width:calc(100vw - 40px);height:min(680px,calc(100vh - 70px));background:var(--panel);border-radius:16px;box-shadow:0 24px 64px -20px rgba(20,24,44,.5);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1);}
.mtg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border);}
.mtg-head-l{display:flex;align-items:flex-start;gap:11px;min-width:0;flex:1;}
.mtg-rec-dot{width:11px;height:11px;border-radius:50%;background:var(--border-strong);flex:0 0 auto;margin-top:7px;}
.mtg-rec-dot.on{background:#e0524a;box-shadow:0 0 0 0 rgba(224,82,79,.55);animation:mtgpulse 1.4s infinite;}
@keyframes mtgpulse{0%{box-shadow:0 0 0 0 rgba(224,82,79,.5);}70%{box-shadow:0 0 0 7px rgba(224,82,79,0);}100%{box-shadow:0 0 0 0 rgba(224,82,79,0);}}
.mtg-titlewrap{position:relative;min-width:0;flex:1;}
.mtg-title{font-family:inherit;font-size:18px;font-weight:700;letter-spacing:-.015em;color:var(--text);border:1.5px solid transparent;border-radius:7px;padding:3px 7px;margin-left:-7px;background:none;outline:none;width:100%;max-width:420px;}
.mtg-title:hover{background:var(--bg);}
.mtg-title:focus{border-color:var(--accent);background:var(--panel);}
.mtg-detected{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:500;padding:2px 4px;border-radius:6px;margin-top:1px;}
.mtg-detected:hover{color:var(--accent);background:var(--accent-soft);}
.mtg-detected svg{flex:0 0 auto;}
.mtg-pick{position:absolute;top:calc(100% + 4px);left:0;z-index:42;background:var(--panel);border:1px solid var(--border);border-radius:11px;box-shadow:0 16px 40px -14px rgba(20,24,44,.5);padding:6px;min-width:300px;animation:pop .14s cubic-bezier(.2,.9,.3,1);}
.mtg-pick-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);padding:5px 8px 7px;}
.mtg-pick-opt{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:8px 9px;border-radius:8px;}
.mtg-pick-opt:hover{background:var(--bg);}
.mtg-pick-opt.on{background:var(--accent-soft);}
.mtg-pick-name{font-size:13.5px;font-weight:600;color:var(--text);}
.mtg-pick-meta{font-size:11.5px;color:var(--muted);}
.mtg-head-r{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.mtg-lang{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:8px;padding:0 4px 0 9px;color:var(--muted);background:var(--panel);}
.mtg-lang-sel{border:none;outline:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;padding:7px 4px;}
.mtg-timer{font-size:14px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.mtg-x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.mtg-x:hover{background:var(--bg);color:var(--text);}

.mtg-body{flex:1;min-height:0;display:flex;background:color-mix(in srgb,var(--bg) 45%,var(--panel));}
.mtg-transcript{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.mtg-listening{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:30px 4px;}
.mtg-listening-pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:mtgpulse2 1.3s infinite;}
@keyframes mtgpulse2{0%,100%{opacity:.3;transform:scale(.85);}50%{opacity:1;transform:scale(1.1);}}
.mtg-seg{display:flex;flex-direction:column;gap:4px;}
.mtg-spk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text-2);align-self:flex-start;padding:2px 4px;border-radius:6px;}
.mtg-spk:hover{background:var(--bg);}
.mtg-spk.static{pointer-events:none;}
.mtg-spk-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
.spk-2 .mtg-spk-dot{background:#1fb5a3;}
.spk-3 .mtg-spk-dot{background:#e8743a;}
.mtg-spk-input{font-family:inherit;font-size:11.5px;font-weight:700;color:var(--text);border:1.5px solid var(--accent);border-radius:5px;padding:1px 5px;outline:none;background:var(--panel);width:120px;}
.mtg-seg-text{font-size:14.5px;line-height:1.55;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;border-top-left-radius:3px;padding:9px 13px;align-self:flex-start;max-width:88%;}
.mtg-seg.interim .mtg-seg-text{color:var(--muted);font-style:italic;background:none;border-style:dashed;}
.mtg-fallback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:11px;padding:30px;}
.mtg-fallback-ic{width:58px;height:58px;border-radius:15px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:var(--shadow);}
.mtg-fallback-title{margin:6px 0 0;font-size:16px;font-weight:700;color:var(--text);}
.mtg-fallback-sub{margin:0;font-size:13.5px;color:var(--muted);max-width:340px;line-height:1.5;}
.mtg-sample-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);}
.mtg-sample-row button{font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--border);background:var(--panel);padding:6px 13px;border-radius:8px;}
.mtg-sample-row button:hover{border-color:var(--accent);background:var(--accent-soft);}
.mtg-sample-btns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;}
.mtg-sample-big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:11px;border:1.5px solid var(--border);background:var(--panel);transition:.12s;color:var(--text);}
.mtg-sample-big:hover{border-color:var(--accent);background:var(--accent-soft);}
.mtg-sample-big svg{color:var(--accent);flex:0 0 auto;}
.mtg-sample-big span{display:flex;flex-direction:column;gap:1px;}
.mtg-sample-big b{font-size:14px;font-weight:700;}
.mtg-sample-big i{font-size:12px;font-style:normal;color:var(--muted);}
.mtg-live-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted);margin-top:8px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--panel);}
.mtg-live-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

.mtg-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-top:1px solid var(--border);background:var(--panel);}
.mtg-foot-l{display:flex;align-items:center;gap:12px;min-width:0;}
.mtg-bars{display:flex;align-items:center;gap:2px;height:26px;width:130px;}
.mtg-bars span{flex:1;background:var(--accent);border-radius:2px;opacity:.85;transition:height .08s linear;align-self:center;min-height:2px;}
.mtg-foot-note{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;}
.mtg-foot-r{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.mtg-ctl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text-2);border:1px solid var(--border);background:var(--panel);padding:9px 14px;border-radius:9px;}
.mtg-ctl:hover{border-color:var(--border-strong);}

.mtg-generating{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;}
.mtg-gen-orb{width:66px;height:66px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;animation:mtgfloat 1.8s ease-in-out infinite;}
@keyframes mtgfloat{0%,100%{transform:translateY(0);box-shadow:0 0 0 0 var(--accent-soft);}50%{transform:translateY(-5px);}}
.mtg-gen-title{margin:6px 0 0;font-size:17px;font-weight:700;color:var(--text);}
.mtg-gen-sub{margin:0;font-size:13.5px;color:var(--muted);max-width:320px;line-height:1.5;}

.mtg-review{flex:1;min-height:0;overflow:auto;padding:18px 20px;background:color-mix(in srgb,var(--bg) 45%,var(--panel));}
.mtg-review-grid{display:grid;gap:14px;}
.mtg-layout-stacked .mtg-review-grid{grid-template-columns:1fr;}
.mtg-layout-columns .mtg-review-grid{grid-template-columns:1fr 1fr;align-items:start;}
.mtg-layout-columns .mtg-card-summary{grid-column:1 / -1;}
.mtg-layout-cards .mtg-review-grid{grid-template-columns:1fr 1fr;align-items:start;}
.mtg-layout-cards .mtg-card-summary,.mtg-layout-cards .mtg-card-transcript{grid-column:1 / -1;}
.mtg-card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:15px 17px;box-shadow:var(--shadow);}
.mtg-card-h{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.mtg-card-h svg{color:var(--accent);}
.mtg-count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--bg);padding:1px 9px;border-radius:9px;text-transform:none;letter-spacing:0;}
.mtg-summary{margin:0;font-size:15px;line-height:1.6;color:var(--text);}
.mtg-decisions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
.mtg-decisions li{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5;color:var(--text);}
.mtg-dec-tick{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:#e6f4ec;color:#2f9e6f;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.mtg-empty-sm{margin:0;font-size:13px;color:var(--muted-2);}
.mtg-actions{display:flex;flex-direction:column;gap:8px;}
.mtg-ai{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--bg);transition:opacity .12s,border-color .12s;}
.mtg-ai.off{opacity:.5;}
.mtg-ai-check{width:20px;height:20px;border-radius:6px;border:1.8px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;margin-top:1px;transition:.12s;}
.mtg-ai-check:hover{border-color:var(--accent);}
.mtg-ai-check.on{background:var(--accent);border-color:var(--accent);}
.mtg-ai-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.mtg-ai-title{width:100%;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin:-3px -6px;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);background:none;outline:none;}
.mtg-ai-title:hover{background:var(--panel);}
.mtg-ai-title:focus{border-color:var(--accent);background:var(--panel);}
.mtg-ai-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mtg-ai-prio{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--pc);text-transform:capitalize;border:1px solid color-mix(in srgb,var(--pc) 35%,transparent);background:color-mix(in srgb,var(--pc) 10%,var(--panel));padding:3px 9px;border-radius:20px;}
.mtg-ai-dot{width:7px;height:7px;border-radius:50%;background:var(--pc);}
.mtg-ai-owner,.mtg-ai-due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--muted);}
.mtg-ai-owner svg,.mtg-ai-due svg{color:var(--muted-2);}
.mtg-tr-scroll{display:flex;flex-direction:column;gap:11px;max-height:230px;overflow:auto;padding-right:4px;}
.mtg-card-transcript .mtg-seg-text{font-size:13.5px;max-width:100%;}
.mtg-ctl.danger{color:#d2553f;border-color:#f0c4bc;}
.mtg-ctl.danger:hover{background:#fdf1ee;border-color:#e7b9b0;}

/* ---- minimized meeting pill ---- */
.mtg-pill{position:fixed;bottom:22px;right:24px;z-index:60;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:0 8px 28px -8px rgba(20,24,44,.32),0 2px 8px rgba(20,24,44,.08);cursor:pointer;transition:box-shadow .15s,border-color .15s;user-select:none;}
.mtg-pill:hover{border-color:var(--accent);box-shadow:0 8px 28px -8px rgba(91,91,214,.28),0 2px 8px rgba(20,24,44,.08);}
.mtg-pill-dot{width:10px;height:10px;border-radius:50%;background:var(--border-strong);flex:0 0 auto;}
.mtg-pill-dot.on{background:#e0524a;animation:mtgpulse 1.4s infinite;}
.mtg-pill-title{font-size:13.5px;font-weight:600;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mtg-pill-timer{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.mtg-pill-lang{font-size:12px;color:var(--muted);padding:2px 8px;background:var(--bg);border-radius:6px;}
.mtg-pill-x{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted-2);margin-left:2px;flex:0 0 auto;}
.mtg-pill-x:hover{background:var(--bg);color:#d2553f;}
</style>
</head>
